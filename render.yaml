services:
  - type: web
    name: hitna-gestion
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:app --timeout 60
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: DATABASE_URL
        # ✅ Ajout de ?sslmode=require à la fin
        value: "postgresql://postgres:hitna-gestion_db@db.rckfkvfrayhojemkvgjf.supabase.co:5432/postgres?sslmode=require"
      - key: SECRET_KEY
        generateValue: true
      - key: BACKUP_SECRET
        generateValue: true
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false